<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Séquenceur & Boîte à Rythmes — YT Music Web Mixer</title>
    <!-- Tone.js — bundle local (la CSP interdit unpkg) -->
    <script src="js/vendor/tone.js"></script>
    <link rel="stylesheet" href="css/sequencer.css">
</head>
<body class="debug-zones">

    <header id="sequencer-header">
        <div class="header-left">
            <h1>🥁 Séquenceur & Boîte à Rythmes</h1>
            <a href="index.html" class="back-link">← Retour au Mixer</a>
        </div>
        
        <div class="transport-controls">
            <div class="control-group">
                <label for="bpm">BPM</label>
                <input type="range" id="bpm" min="40" max="240" value="120">
                <span id="bpm-value">120</span>
            </div>
            <div class="control-group">
                <label for="master-volume">Volume Master</label>
                <input type="range" id="master-volume" min="0" max="100" value="80">
                <span id="vol-value">80%</span>
            </div>
            <div class="rythmes-wrap" id="rythmes-wrap">
                <button type="button" id="rythmes-btn" class="track-sound-toggle" aria-haspopup="listbox" aria-expanded="false">Rythmes ▾</button>
                <div id="rythmes-menu" class="track-sound-menu rythmes-menu" hidden role="listbox" aria-label="Presets rythmes"></div>
            </div>
            <div class="factory-wrap" id="factory-wrap">
                <button type="button" id="factory-btn" class="track-sound-toggle" aria-haspopup="listbox" aria-expanded="false">🎵 Presets ▾</button>
                <div id="factory-menu" class="track-sound-menu factory-menu" hidden role="listbox" aria-label="Presets d'usine"></div>
            </div>
            <div class="playback-btns">
                <button id="play-pause">Play</button>
                <button id="stop">Stop</button>
                <button id="clear-grid" type="button" class="btn-clear-grid">🗑 Clear</button>
                <button id="randomize" type="button" class="btn-randomize" title="Génère un nouveau pattern musicalement sensé à chaque clic">🎲 Randomize</button>
                <button id="save-preset" type="button" class="btn-save-preset" title="Sauvegarde le rythme courant (grille + BPM) sous un nom">💾 Sauvegarder</button>
            </div>
        </div>
    </header>

    <!-- Modale de nommage du preset utilisateur (cachée par défaut) -->
    <div id="save-preset-modal" class="save-preset-modal" hidden role="dialog" aria-modal="true" aria-labelledby="save-preset-title">
        <div class="save-preset-dialog">
            <h3 id="save-preset-title">💾 Sauvegarder le rythme</h3>
            <input id="save-preset-name" type="text" maxlength="40" placeholder="Nom du rythme…" autocomplete="off" />
            <div class="save-preset-actions">
                <button id="save-preset-cancel" type="button">Annuler</button>
                <button id="save-preset-confirm" type="button" class="primary">Sauvegarder</button>
            </div>
            <p id="save-preset-feedback" class="save-preset-feedback" hidden></p>
        </div>
    </div>

    <main>
        <section id="sequencer-container" class="sequencer-layout">
            <div class="sequencer-matrix-scroll" role="region" aria-label="Grille des 16 pas" tabindex="0">
                <div class="sequencer-matrix-layout">
                    <div id="instrument-names" class="instrument-col"></div>
                    <div id="step-matrix" class="steps-col"></div>
                </div>
            </div>
            <section id="sample-track" aria-labelledby="sample-track-title">
                <div class="sample-track-left">
                    <h2 id="sample-track-title">Piste audio</h2>
                    <div class="track-name-wrap sample-track-controls">
                        <span id="sample-name" class="track-name">Aucun fichier</span>
                        <button id="sample-load" type="button" class="track-sound-toggle" aria-label="Charger un échantillon audio">Charger</button>
                        <input id="sample-file" type="file" accept="audio/*,.mp3" hidden>
                        <fieldset id="sample-options" aria-label="Mode de lecture" disabled>
                            <label class="sample-loop-control">
                                <input id="sample-loop" type="checkbox" checked>
                                <span class="track-sound-toggle">Boucler</span>
                            </label>
                        </fieldset>
                        <button id="sample-remove" type="button" class="track-sound-toggle" aria-label="Retirer l’échantillon audio" title="Retirer l’échantillon audio" disabled>×</button>
                    </div>
                    <p id="sample-status" role="status"></p>
                </div>
                <div class="sample-waveform">
                    <p id="sample-empty">Dépose un fichier audio ici.</p>
                    <div id="sample-timeline" role="group" aria-label="Forme d’onde et bornes du passage" hidden>
                        <div class="sample-marker-lane sample-start-lane">
                            <span class="sample-marker-label" id="sample-start-time"></span>
                            <div id="sample-start" class="sample-marker" title="Déplacer le début" aria-hidden="true"></div>
                        </div>
                        <div class="sample-waveform-plot">
                            <svg viewBox="0 0 600 100" preserveAspectRatio="none" aria-hidden="true">
                                <path id="sample-peaks" />
                            </svg>
                            <div class="sample-waveform-shade" aria-hidden="true"></div>
                            <span id="sample-duration" aria-label="Durée totale"></span>
                        </div>
                        <div class="sample-marker-lane sample-end-lane">
                            <div id="sample-end" class="sample-marker" title="Déplacer la fin" aria-hidden="true"></div>
                            <span class="sample-marker-label" id="sample-end-time"></span>
                        </div>
                    </div>
                </div>
            </section>
            <section id="drum-kit-view" class="drum-kit-view">
                <!-- Batterie alignée sous le bloc steps, même largeur -->
            </section>
        </section>
    </main>

    <footer>
        <p>YT Music Web Mixer — Séquenceur Tone.js</p>
    </footer>

    <!-- Vendor + données (chargés AVANT les sous-modules du séquenceur) -->
    <script src="js/vendor/tone.js"></script>
    <script src="js/sequencer-samples.js"></script>     <!-- DRUM_KITS, KIT_LIST -->
    <script src="js/musicca-presets.js"></script>      <!-- MUSICA_PRESETS, musicaToGrid, findMusicaPreset -->
    <script src="js/user-presets.js"></script>         <!-- window.USER_PRESETS (format aligné pour réutiliser musicaToGrid) -->
    <script src="js/factory-presets.js"></script>      <!-- FACTORY_PRESETS, findFactoryPreset -->
    <!-- Sous-modules du séquenceur (ordre important) -->
    <script src="js/sequencer-config.js"></script>       <!-- GRID_TRACKS, DRUM_PADS, gridEl, état global -->
    <script src="js/sequencer-mix.js"></script>          <!-- TRACK_GAIN_NODES, buildTrackMix -->
    <script src="js/sequencer-sound.js"></script>        <!-- padConfig, buildTrackSoundToggle, playNoteByConfig -->
    <script src="js/sequencer-grid.js"></script>         <!-- initGrid, clearGrid, randomizeGrid -->
    <script src="js/sequencer-drumkit.js"></script>      <!-- initDrumKit, triggerPadDown/Up -->
    <script src="js/sequencer-presets.js"></script>      <!-- loadMusiccaPreset, initRythmesMenu, loadFactoryPreset -->
    <script src="js/sequencer-transport.js"></script>    <!-- setBpm, togglePlay, stopSequencer -->
    <script src="js/track-waveform.js"></script>         <!-- Tracé partagé avec les voies DJ -->
    <script src="js/sequencer-sample-track.js"></script> <!-- Piste audio locale indépendante -->

    <!-- Orchestrateur (doit être chargé EN DERNIER) -->
    <script src="js/sequencer-app.js"></script>
</body>
</html>
