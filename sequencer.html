<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Séquenceur & Boîte à Rythmes — YT Music Web Mixer</title>
    <!-- Tone.js — bundle local (la CSP interdit unpkg) -->
    <script src="js/vendor/tone.js"></script>
    <link rel="stylesheet" href="css/sequencer.css">
</head>
<body class="debug-zones">

    <header id="sequencer-header">
        <div class="header-left">
            <h1>🥁 Séquenceur & Boîte à Rythmes</h1>
            <a href="index.html" class="back-link">← Retour au Mixer</a>
        </div>
        
        <div class="transport-controls">
            <div class="control-group">
                <label for="bpm">BPM</label>
                <input type="range" id="bpm" min="40" max="240" value="120">
                <span id="bpm-value">120</span>
            </div>
            <div class="control-group">
                <label for="master-volume">Volume Master</label>
                <input type="range" id="master-volume" min="0" max="100" value="80">
                <span id="vol-value">80%</span>
            </div>
            <div class="rythmes-wrap" id="rythmes-wrap">
                <button type="button" id="rythmes-btn" class="track-sound-toggle" aria-haspopup="listbox" aria-expanded="false">Rythmes ▾</button>
                <div id="rythmes-menu" class="track-sound-menu rythmes-menu" hidden role="listbox" aria-label="Presets rythmes"></div>
            </div>
            <div class="factory-wrap" id="factory-wrap">
                <button type="button" id="factory-btn" class="track-sound-toggle" aria-haspopup="listbox" aria-expanded="false">🎵 Presets ▾</button>
                <div id="factory-menu" class="track-sound-menu factory-menu" hidden role="listbox" aria-label="Presets d'usine"></div>
            </div>
            <div class="playback-btns">
                <button id="play-pause">Play</button>
                <button id="stop">Stop</button>
                <button id="clear-grid" type="button" class="btn-clear-grid">🗑 Clear</button>
                <button id="randomize" type="button" class="btn-randomize" title="Génère un pattern musicalement sensé (déterministe : même seed à chaque clic)">🎲 Randomize</button>
            </div>
        </div>
    </header>

    <main>
        <section id="sequencer-container" class="sequencer-layout">
            <div id="instrument-names" class="instrument-col"></div>
            <div class="right-col">
                <div id="step-matrix" class="steps-col"></div>
                <section id="drum-kit-view" class="drum-kit-view">
                    <!-- Batterie alignée sous le bloc steps, même largeur -->
                </section>
            </div>
        </section>
    </main>

    <footer>
        <p>YT Music Web Mixer — Séquenceur Tone.js</p>
    </footer>

    <!-- Vendor + données (chargés AVANT les sous-modules du séquenceur) -->
    <script src="js/vendor/tone.js"></script>
    <script src="js/sequencer-samples.js"></script>     <!-- DRUM_KITS, KIT_LIST -->
    <script src="js/musicca-presets.js"></script>      <!-- MUSICA_PRESETS, musicaToGrid, findMusicaPreset -->
    <script src="js/factory-presets.js"></script>      <!-- FACTORY_PRESETS, findFactoryPreset -->

    <!-- Sous-modules du séquenceur (ordre important) -->
    <script src="js/sequencer-config.js"></script>       <!-- GRID_TRACKS, DRUM_PADS, gridEl, état global -->
    <script src="js/sequencer-mix.js"></script>          <!-- TRACK_GAIN_NODES, buildTrackMix -->
    <script src="js/sequencer-sound.js"></script>        <!-- padConfig, buildTrackSoundToggle, playNoteByConfig -->
    <script src="js/sequencer-grid.js"></script>         <!-- initGrid, clearGrid, randomizeGrid -->
    <script src="js/sequencer-drumkit.js"></script>      <!-- initDrumKit, triggerPadDown/Up -->
    <script src="js/sequencer-presets.js"></script>      <!-- loadMusiccaPreset, initRythmesMenu, loadFactoryPreset -->
    <script src="js/sequencer-transport.js"></script>    <!-- setBpm, togglePlay, stopSequencer -->

    <!-- Orchestrateur (doit être chargé EN DERNIER) -->
    <script src="js/sequencer-app.js"></script>
</body>
</html>
