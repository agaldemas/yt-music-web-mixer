<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Fonctionnement du programme — YT Music Web Mixer</title>
  <desc id="desc">Carte de flux de l’application, de la recherche et du fichier local vers la résolution du mode, les moteurs DJ ou IFrame, le bus de mixage et les sorties.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07121b"/><stop offset=".52" stop-color="#0b1824"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#14b8a6" stop-opacity=".22"/><stop offset=".48" stop-color="#38bdf8" stop-opacity=".16"/><stop offset="1" stop-color="#f97316" stop-opacity=".18"/></linearGradient>
    <linearGradient id="cyanCard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b3140"/><stop offset="1" stop-color="#0c1d2b"/></linearGradient>
    <linearGradient id="violetCard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#251c4a"/><stop offset="1" stop-color="#15152d"/></linearGradient>
    <linearGradient id="roseCard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#401b2b"/><stop offset="1" stop-color="#201521"/></linearGradient>
    <linearGradient id="greenCard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10352b"/><stop offset="1" stop-color="#10221f"/></linearGradient>
    <linearGradient id="amberCard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3a2a13"/><stop offset="1" stop-color="#211b13"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#94a3b8" stroke-opacity=".045"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".36"/></filter>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22d3ee"/></marker>
    <marker id="arrowRose" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#fb7185"/></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#fbbf24"/></marker>
    <style>.title{font:700 32px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}.subtitle{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#94a3b8}.eyebrow{font:700 11px 'Segoe UI',Arial,sans-serif;fill:#67e8f9;letter-spacing:1.7px}.section{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#e2e8f0}.cardTitle{font:700 16px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}.body{font:400 13px 'Segoe UI',Arial,sans-serif;fill:#cbd5e1}.small{font:400 11.5px 'Segoe UI',Arial,sans-serif;fill:#94a3b8}.code{font:600 11px Consolas,'Courier New',monospace;fill:#67e8f9}.codeRose{font:600 11px Consolas,'Courier New',monospace;fill:#fda4af}.pillText{font:700 10px 'Segoe UI',Arial,sans-serif;fill:#cbd5e1;letter-spacing:.9px}.card{stroke-width:1.4;rx:14;filter:url(#shadow)}.panel{fill:#0b1522;stroke:#26384a;stroke-width:1.4;rx:22;filter:url(#shadow)}.flow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.flowCyan{fill:none;stroke:#22d3ee;stroke-width:2.7;marker-end:url(#arrowCyan);filter:url(#glowCyan)}.flowRose{fill:none;stroke:#fb7185;stroke-width:2.5;marker-end:url(#arrowRose)}.flowAmber{fill:none;stroke:#fbbf24;stroke-width:2.2;stroke-dasharray:8 7;marker-end:url(#arrowAmber)}.data{fill:none;stroke:#a78bfa;stroke-width:1.8;stroke-dasharray:4 5;marker-end:url(#arrow)}.divider{stroke:#26384a;stroke-width:1}.step{fill:#e2e8f0;stroke:#0f172a;stroke-width:3}.stepText{font:800 12px 'Segoe UI',Arial,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:middle}.legendLine{stroke-width:3}.label{font:600 10.5px 'Segoe UI',Arial,sans-serif;fill:#94a3b8}</style>
  </defs>
  <rect width="1800" height="1200" fill="url(#bg)"/><rect width="1800" height="1200" fill="url(#grid)"/>
  <rect x="34" y="28" width="1732" height="108" rx="24" fill="url(#header)" stroke="#2b4355"/>
  <text class="eyebrow" x="66" y="59">SYSTEM MAP · VUE D’ENSEMBLE</text><text class="title" x="66" y="94">YT Music Web Mixer — fonctionnement du programme</text><text class="subtitle" x="68" y="119">Un flux local-first : trouver, résoudre, mixer — sans perdre le fallback vidéo.</text>
  <rect x="1300" y="54" width="118" height="28" rx="14" fill="#0b2533" stroke="#0891b2"/><text class="pillText" x="1359" y="72" text-anchor="middle">LOCAL-FIRST</text><rect x="1428" y="54" width="122" height="28" rx="14" fill="#211b40" stroke="#8b5cf6"/><text class="pillText" x="1489" y="72" text-anchor="middle">DUAL ENGINE</text><rect x="1560" y="54" width="166" height="28" rx="14" fill="#10281f" stroke="#10b981"/><text class="pillText" x="1643" y="72" text-anchor="middle">WEB AUDIO + IFRAME</text>
  <line x1="1300" y1="101" x2="1726" y2="101" stroke="#94a3b8" stroke-opacity=".18"/><line x1="1302" y1="113" x2="1340" y2="113" stroke="#22d3ee" class="legendLine"/><text class="small" x="1348" y="117">flux audio / DSP</text><line x1="1450" y1="113" x2="1488" y2="113" stroke="#fb7185" class="legendLine"/><text class="small" x="1496" y="117">flux vidéo</text><line x1="1602" y1="113" x2="1640" y2="113" stroke="#fbbf24" class="legendLine" stroke-dasharray="7 5"/><text class="small" x="1648" y="117">fallback</text>
  <rect class="panel" x="48" y="170" width="350" height="530"/><circle class="step" cx="80" cy="206" r="18"/><text class="stepText" x="80" y="206">01</text><text class="section" x="112" y="213">Entrées utilisateur</text><text class="small" x="74" y="237">Chaque deck choisit une source, puis garde son état.</text>
  <rect class="card" x="74" y="270" width="298" height="150" fill="url(#cyanCard)" stroke="#0891b2"/><text class="cardTitle" x="96" y="300">Recherche &amp; sélection</text><text class="body" x="96" y="325">YouTube Data API avec clé</text><text class="body" x="96" y="347">ou recherche Piped sans clé</text><text class="body" x="96" y="369">cartes accessibles + pagination</text><text class="code" x="96" y="398">search.js · videoId validé</text>
  <rect class="card" x="74" y="455" width="298" height="150" fill="url(#greenCard)" stroke="#10b981"/><text class="cardTitle" x="96" y="485">Fichier local</text><text class="body" x="96" y="510">File / Blob — aucun réseau</text><text class="body" x="96" y="532">ID3v2.3/v2.4 + pochette APIC</text><text class="body" x="96" y="554">bascule automatique vers le moteur DJ</text><text class="code" x="96" y="583">local-load.js · id3.js</text><rect x="74" y="640" width="298" height="34" rx="10" fill="#121f2d" stroke="#334155"/><text class="small" x="92" y="662">Sécurité : IDs limités · pas de HTML non échappé</text>
  <rect class="panel" x="450" y="170" width="420" height="530"/><circle class="step" cx="482" cy="206" r="18"/><text class="stepText" x="482" y="206">02</text><text class="section" x="514" y="213">Résolution &amp; état</text><text class="small" x="476" y="237">Un contrôleur orchestre les deux decks sans mode hybride.</text>
  <rect class="card" x="480" y="270" width="360" height="170" fill="url(#violetCard)" stroke="#8b5cf6"/><text class="cardTitle" x="504" y="301">App Controller</text><text class="body" x="504" y="327">préférence : auto / DJ / IFrame</text><text class="body" x="504" y="349">état : resolving → ready → playing</text><text class="body" x="504" y="371">position, mute, cue, loops, pitch</text><text class="code" x="504" y="403">app.js · backendMode + sourceKind</text><text class="code" x="504" y="422">LocalAPI · jeton en mémoire</text>
  <rect class="card" x="480" y="480" width="360" height="150" fill="#172033" stroke="#475569"/><text class="cardTitle" x="504" y="510">Readiness &amp; fallback</text><text class="body" x="504" y="536">/api/health : processus vivant</text><text class="body" x="504" y="558">/api/ready : audio réellement disponible</text><text class="body" x="504" y="580">yt-dlp + ffmpeg séparés et vérifiés</text><text class="code" x="504" y="612">PipedStreams · cache + refresh</text>
  <path class="flowCyan" d="M372 345 C410 345 420 345 480 345"/><text class="label" x="399" y="332">requête</text><path class="data" d="M372 530 C420 530 420 405 480 405"/><text class="label" x="394" y="488">fichier</text><path class="flow" d="M660 440 V480"/><text class="label" x="674" y="465">capacité</text>
  <rect class="panel" x="920" y="170" width="832" height="530"/><circle class="step" cx="952" cy="206" r="18"/><text class="stepText" x="952" y="206">03</text><text class="section" x="984" y="213">Deux moteurs de lecture</text><text class="small" x="946" y="237">Le choix du moteur change les capacités, pas les contrôles utilisateur.</text>
  <text class="eyebrow" x="950" y="274">A · MODE DJ — AUDIO LOCAL / DSP</text><rect class="card" x="950" y="292" width="220" height="146" fill="url(#cyanCard)" stroke="#0891b2"/><text class="cardTitle" x="972" y="322">Backend local</text><text class="body" x="972" y="347">oEmbed rapide</text><text class="body" x="972" y="369">/api/audio + Range</text><text class="body" x="972" y="391">token + cache borné</text><text class="code" x="972" y="419">server/server.js</text><rect class="card" x="1215" y="292" width="220" height="146" fill="url(#amberCard)" stroke="#d97706"/><text class="cardTitle" x="1237" y="322">Extraction</text><text class="body" x="1237" y="347">yt-dlp → ffmpeg → MP3</text><text class="body" x="1237" y="369">≤ 30 min · pas de live</text><text class="body" x="1237" y="391">queue ≤ 2 actifs / 16 en attente</text><text class="code" x="1237" y="419">task-queue · cache-manager</text><rect class="card" x="1480" y="292" width="242" height="146" fill="url(#violetCard)" stroke="#8b5cf6"/><text class="cardTitle" x="1502" y="322">AudioPlayer A / B</text><text class="body" x="1502" y="347">AbortController + génération</text><text class="body" x="1502" y="369">Blob URL + décodage tee</text><text class="body" x="1502" y="391">dispose() sans réponse obsolète</text><text class="code" x="1502" y="419">audio-player.js</text><path class="flowCyan" d="M840 350 H950"/><path class="flowCyan" d="M1170 365 H1215"/><path class="flowCyan" d="M1435 365 H1480"/>
  <text class="eyebrow" x="950" y="486">B · MODE IFRAME — VIDÉO YOUTUBE</text><rect class="card" x="950" y="505" width="300" height="126" fill="url(#roseCard)" stroke="#e11d48"/><text class="cardTitle" x="974" y="535">YouTube IFrame API</text><text class="body" x="974" y="560">vidéo cross-origin</text><text class="body" x="974" y="582">play / pause / seek / volume</text><text class="body" x="974" y="604">destroy() sur chaque bascule</text><rect class="card" x="1290" y="505" width="432" height="126" fill="#241923" stroke="#9f1239"/><text class="cardTitle" x="1314" y="535">Fallback public Piped</text><text class="body" x="1314" y="560">cascade d’instances si le backend local échoue</text><text class="body" x="1314" y="582">URL CORS-safe ; anti-bot classé séparément</text><text class="codeRose" x="1314" y="612">fallback → IFrame si aucune source jouable</text><path class="flowRose" d="M840 385 C890 385 900 568 950 568"/><path class="flowAmber" d="M1170 568 H1290"/><text class="label" x="1181" y="552">si nécessaire</text>
  <rect class="panel" x="48" y="735" width="1704" height="410"/><circle class="step" cx="80" cy="771" r="18"/><text class="stepText" x="80" y="771">04</text><text class="section" x="112" y="778">Bus de mixage, outils et sorties</text><text class="small" x="74" y="803">Le traitement commun commence après la sélection du moteur.</text>
  <rect class="card" x="74" y="830" width="360" height="196" fill="url(#cyanCard)" stroke="#0891b2"/><text class="cardTitle" x="98" y="860">Chaîne par deck</text><text class="body" x="98" y="887">MediaElementSource</text><text class="body" x="98" y="909">→ scratchGain → EQ 3 bandes</text><text class="body" x="98" y="931">→ filtre DJ → trim → muteGain</text><text class="body" x="98" y="953">→ deckGain → masterGain</text><text class="code" x="98" y="992">scratch ≤ 10 min · AudioEngine</text><rect class="card" x="478" y="830" width="360" height="196" fill="url(#violetCard)" stroke="#8b5cf6"/><text class="cardTitle" x="502" y="860">Mix bus</text><text class="body" x="502" y="887">crossfader equal-power</text><text class="body" x="502" y="909">volume master + auto crossfade</text><text class="body" x="502" y="931">ramping Web Audio en mode DJ</text><text class="body" x="502" y="953">paliers volume en mode IFrame</text><text class="code" x="502" y="992">mixer.js · setMuted() séparé</text><rect class="card" x="882" y="830" width="360" height="196" fill="url(#greenCard)" stroke="#10b981"/><text class="cardTitle" x="906" y="860">Outils live</text><text class="body" x="906" y="887">visualizers spectre / waveform</text><text class="body" x="906" y="909">BPM + SYNC tempo de B</text><text class="body" x="906" y="931">cue points et boucles</text><text class="body" x="906" y="953">transport et synchronisation</text><text class="code" x="906" y="992">Visualizer · BPMDetector · Scratch</text><rect class="card" x="1286" y="830" width="436" height="196" fill="url(#amberCard)" stroke="#d97706"/><text class="cardTitle" x="1310" y="860">Sorties &amp; garde-fous</text><text class="body" x="1310" y="887">haut-parleurs via Web Audio</text><text class="body" x="1310" y="909">téléchargement local authentifié</text><text class="body" x="1310" y="931">cache disque : 2 Go / 100 pistes</text><text class="body" x="1310" y="953">serveur : 127.0.0.1 uniquement</text><text class="code" x="1310" y="992">health · ready · X-Local-Token</text>
  <path class="flowCyan" d="M1060 631 C1060 720 254 740 254 830"/><path class="flowRose" d="M1100 631 C1200 720 656 740 656 830"/><path class="flow" d="M656 1026 H882"/><path class="flow" d="M1242 928 H1286"/><text class="label" x="696" y="1047">signal mixé</text><text class="label" x="1250" y="913">outils / état</text><rect x="74" y="1060" width="1648" height="54" rx="14" fill="#0b1420" stroke="#334155"/><circle cx="102" cy="1087" r="7" fill="#22d3ee"/><text class="body" x="122" y="1092">Principe clé :</text><text class="small" x="220" y="1092">les résultats obsolètes sont annulés, les ressources sont libérées, et le fallback reste explicite plutôt que silencieux.</text><text class="code" x="1394" y="1092">v1 · août 2026</text>
</svg>
