<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">How the program works — YT Music Web Mixer</title>
  <desc id="desc">Application flow map from search and local files through mode resolution, DJ or IFrame engines, the mix bus, and outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07121b"/><stop offset=".52" stop-color="#0b1824"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#14b8a6" stop-opacity=".22"/><stop offset=".48" stop-color="#38bdf8" stop-opacity=".16"/><stop offset="1" stop-color="#f97316" stop-opacity=".18"/></linearGradient>
    <linearGradient id="cyanCard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b3140"/><stop offset="1" stop-color="#0c1d2b"/></linearGradient>
    <linearGradient id="violetCard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#251c4a"/><stop offset="1" stop-color="#15152d"/></linearGradient>
    <linearGradient id="roseCard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#401b2b"/><stop offset="1" stop-color="#201521"/></linearGradient>
    <linearGradient id="greenCard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10352b"/><stop offset="1" stop-color="#10221f"/></linearGradient>
    <linearGradient id="amberCard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3a2a13"/><stop offset="1" stop-color="#211b13"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#94a3b8" stroke-opacity=".045"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".36"/></filter>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22d3ee"/></marker>
    <marker id="arrowRose" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#fb7185"/></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#fbbf24"/></marker>
    <style>.title{font:700 32px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}.subtitle{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#94a3b8}.eyebrow{font:700 11px 'Segoe UI',Arial,sans-serif;fill:#67e8f9;letter-spacing:1.7px}.section{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#e2e8f0}.cardTitle{font:700 16px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}.body{font:400 13px 'Segoe UI',Arial,sans-serif;fill:#cbd5e1}.small{font:400 11.5px 'Segoe UI',Arial,sans-serif;fill:#94a3b8}.code{font:600 11px Consolas,'Courier New',monospace;fill:#67e8f9}.codeRose{font:600 11px Consolas,'Courier New',monospace;fill:#fda4af}.pillText{font:700 10px 'Segoe UI',Arial,sans-serif;fill:#cbd5e1;letter-spacing:.9px}.card{stroke-width:1.4;rx:14;filter:url(#shadow)}.panel{fill:#0b1522;stroke:#26384a;stroke-width:1.4;rx:22;filter:url(#shadow)}.flow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.flowCyan{fill:none;stroke:#22d3ee;stroke-width:2.7;marker-end:url(#arrowCyan);filter:url(#glowCyan)}.flowRose{fill:none;stroke:#fb7185;stroke-width:2.5;marker-end:url(#arrowRose)}.flowAmber{fill:none;stroke:#fbbf24;stroke-width:2.2;stroke-dasharray:8 7;marker-end:url(#arrowAmber)}.data{fill:none;stroke:#a78bfa;stroke-width:1.8;stroke-dasharray:4 5;marker-end:url(#arrow)}.divider{stroke:#26384a;stroke-width:1}.step{fill:#e2e8f0;stroke:#0f172a;stroke-width:3}.stepText{font:800 12px 'Segoe UI',Arial,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:middle}.legendLine{stroke-width:3}.label{font:600 10.5px 'Segoe UI',Arial,sans-serif;fill:#94a3b8}</style>
  </defs>
  <rect width="1800" height="1200" fill="url(#bg)"/><rect width="1800" height="1200" fill="url(#grid)"/>
  <rect x="34" y="28" width="1732" height="108" rx="24" fill="url(#header)" stroke="#2b4355"/>
  <text class="eyebrow" x="66" y="59">SYSTEM MAP · OVERVIEW</text><text class="title" x="66" y="94">YT Music Web Mixer — how the program works</text><text class="subtitle" x="68" y="119">A local-first flow: find, resolve, mix — without losing the video fallback.</text>
  <rect x="1300" y="54" width="118" height="28" rx="14" fill="#0b2533" stroke="#0891b2"/><text class="pillText" x="1359" y="72" text-anchor="middle">LOCAL-FIRST</text><rect x="1428" y="54" width="122" height="28" rx="14" fill="#211b40" stroke="#8b5cf6"/><text class="pillText" x="1489" y="72" text-anchor="middle">DUAL ENGINE</text><rect x="1560" y="54" width="166" height="28" rx="14" fill="#10281f" stroke="#10b981"/><text class="pillText" x="1643" y="72" text-anchor="middle">WEB AUDIO + IFRAME</text>
  <line x1="1300" y1="101" x2="1726" y2="101" stroke="#94a3b8" stroke-opacity=".18"/><line x1="1302" y1="113" x2="1340" y2="113" stroke="#22d3ee" class="legendLine"/><text class="small" x="1348" y="117">audio / DSP flow</text><line x1="1450" y1="113" x2="1488" y2="113" stroke="#fb7185" class="legendLine"/><text class="small" x="1496" y="117">video flow</text><line x1="1602" y1="113" x2="1640" y2="113" stroke="#fbbf24" class="legendLine" stroke-dasharray="7 5"/><text class="small" x="1648" y="117">fallback</text>
  <rect class="panel" x="48" y="170" width="350" height="530"/><circle class="step" cx="80" cy="206" r="18"/><text class="stepText" x="80" y="206">01</text><text class="section" x="112" y="213">User inputs</text><text class="small" x="74" y="237">Each deck chooses a source, then keeps its state.</text>
  <rect class="card" x="74" y="270" width="298" height="150" fill="url(#cyanCard)" stroke="#0891b2"/><text class="cardTitle" x="96" y="300">Search &amp; selection</text><text class="body" x="96" y="325">YouTube Data API with a key</text><text class="body" x="96" y="347">or keyless Piped search</text><text class="body" x="96" y="369">accessible cards + pagination</text><text class="code" x="96" y="398">search.js · validated videoId</text>
  <rect class="card" x="74" y="455" width="298" height="150" fill="url(#greenCard)" stroke="#10b981"/><text class="cardTitle" x="96" y="485">Local file</text><text class="body" x="96" y="510">File / Blob — no network</text><text class="body" x="96" y="532">ID3v2.3/v2.4 + APIC artwork</text><text class="body" x="96" y="554">automatic switch to the DJ engine</text><text class="code" x="96" y="583">local-load.js · id3.js</text><rect x="74" y="640" width="298" height="34" rx="10" fill="#121f2d" stroke="#334155"/><text class="small" x="92" y="662">Security: constrained IDs · no unescaped HTML</text>
  <rect class="panel" x="450" y="170" width="420" height="530"/><circle class="step" cx="482" cy="206" r="18"/><text class="stepText" x="482" y="206">02</text><text class="section" x="514" y="213">Resolution &amp; state</text><text class="small" x="476" y="237">One controller orchestrates both decks without a hybrid mode.</text>
  <rect class="card" x="480" y="270" width="360" height="170" fill="url(#violetCard)" stroke="#8b5cf6"/><text class="cardTitle" x="504" y="301">App Controller</text><text class="body" x="504" y="327">preference: auto / DJ / IFrame</text><text class="body" x="504" y="349">state: resolving → ready → playing</text><text class="body" x="504" y="371">position, mute, cue, loops, pitch</text><text class="code" x="504" y="403">app.js · backendMode + sourceKind</text><text class="code" x="504" y="422">LocalAPI · in-memory token</text>
  <rect class="card" x="480" y="480" width="360" height="150" fill="#172033" stroke="#475569"/><text class="cardTitle" x="504" y="510">Readiness &amp; fallback</text><text class="body" x="504" y="536">/api/health : live process</text><text class="body" x="504" y="558">/api/ready : audio actually available</text><text class="body" x="504" y="580">yt-dlp + ffmpeg checked separately</text><text class="code" x="504" y="612">PipedStreams · cache + refresh</text>
  <path class="flowCyan" d="M372 345 C410 345 420 345 480 345"/><text class="label" x="399" y="332">query</text><path class="data" d="M372 530 C420 530 420 405 480 405"/><text class="label" x="394" y="488">file</text><path class="flow" d="M660 440 V480"/><text class="label" x="674" y="465">capability</text>
  <rect class="panel" x="920" y="170" width="832" height="530"/><circle class="step" cx="952" cy="206" r="18"/><text class="stepText" x="952" y="206">03</text><text class="section" x="984" y="213">Two playback engines</text><text class="small" x="946" y="237">Le choix du moteur change les capabilitys, pas les contrôles utilisateur.</text>
  <text class="eyebrow" x="950" y="274">A · DJ MODE — LOCAL AUDIO / DSP</text><rect class="card" x="950" y="292" width="220" height="146" fill="url(#cyanCard)" stroke="#0891b2"/><text class="cardTitle" x="972" y="322">Local backend</text><text class="body" x="972" y="347">fast oEmbed</text><text class="body" x="972" y="369">/api/audio + Range</text><text class="body" x="972" y="391">token + bounded cache</text><text class="code" x="972" y="419">server/server.js</text><rect class="card" x="1215" y="292" width="220" height="146" fill="url(#amberCard)" stroke="#d97706"/><text class="cardTitle" x="1237" y="322">Extraction</text><text class="body" x="1237" y="347">yt-dlp → ffmpeg → MP3</text><text class="body" x="1237" y="369">≤ 30 min · no live streams</text><text class="body" x="1237" y="391">queue ≤ 2 active / 16 waiting</text><text class="code" x="1237" y="419">task-queue · cache-manager</text><rect class="card" x="1480" y="292" width="242" height="146" fill="url(#violetCard)" stroke="#8b5cf6"/><text class="cardTitle" x="1502" y="322">AudioPlayer A / B</text><text class="body" x="1502" y="347">AbortController + generation</text><text class="body" x="1502" y="369">Blob URL + tee decoding</text><text class="body" x="1502" y="391">dispose() without stale responses</text><text class="code" x="1502" y="419">audio-player.js</text><path class="flowCyan" d="M840 350 H950"/><path class="flowCyan" d="M1170 365 H1215"/><path class="flowCyan" d="M1435 365 H1480"/>
  <text class="eyebrow" x="950" y="486">B · IFRAME MODE — YOUTUBE VIDEO</text><rect class="card" x="950" y="505" width="300" height="126" fill="url(#roseCard)" stroke="#e11d48"/><text class="cardTitle" x="974" y="535">YouTube IFrame API</text><text class="body" x="974" y="560">cross-origin video</text><text class="body" x="974" y="582">play / pause / seek / volume</text><text class="body" x="974" y="604">destroy() on every switch</text><rect class="card" x="1290" y="505" width="432" height="126" fill="#241923" stroke="#9f1239"/><text class="cardTitle" x="1314" y="535">Public Piped fallback</text><text class="body" x="1314" y="560">instance cascade if the local backend fails</text><text class="body" x="1314" y="582">CORS-safe URL; anti-bot classified separately</text><text class="codeRose" x="1314" y="612">fallback → IFrame if no playable source</text><path class="flowRose" d="M840 385 C890 385 900 568 950 568"/><path class="flowAmber" d="M1170 568 H1290"/><text class="label" x="1181" y="552">if needed</text>
  <rect class="panel" x="48" y="735" width="1704" height="410"/><circle class="step" cx="80" cy="771" r="18"/><text class="stepText" x="80" y="771">04</text><text class="section" x="112" y="778">Mix bus, tools, and outputs</text><text class="small" x="74" y="803">Shared processing starts after the engine is selected.</text>
  <rect class="card" x="74" y="830" width="360" height="196" fill="url(#cyanCard)" stroke="#0891b2"/><text class="cardTitle" x="98" y="860">Per-deck chain</text><text class="body" x="98" y="887">MediaElementSource</text><text class="body" x="98" y="909">→ scratchGain → 3-band EQ</text><text class="body" x="98" y="931">→ DJ filter → trim → muteGain</text><text class="body" x="98" y="953">→ deckGain → masterGain</text><text class="code" x="98" y="992">scratch ≤ 10 min · AudioEngine</text><rect class="card" x="478" y="830" width="360" height="196" fill="url(#violetCard)" stroke="#8b5cf6"/><text class="cardTitle" x="502" y="860">Mix bus</text><text class="body" x="502" y="887">equal-power crossfader</text><text class="body" x="502" y="909">master volume + auto crossfade</text><text class="body" x="502" y="931">Web Audio ramping in DJ mode</text><text class="body" x="502" y="953">volume steps in IFrame mode</text><text class="code" x="502" y="992">mixer.js · separate setMuted()</text><rect class="card" x="882" y="830" width="360" height="196" fill="url(#greenCard)" stroke="#10b981"/><text class="cardTitle" x="906" y="860">Live tools</text><text class="body" x="906" y="887">spectrum / waveform visualizers</text><text class="body" x="906" y="909">BPM + SYNC B tempo</text><text class="body" x="906" y="931">cue points and loops</text><text class="body" x="906" y="953">transport and sync</text><text class="code" x="906" y="992">Visualizer · BPMDetector · Scratch</text><rect class="card" x="1286" y="830" width="436" height="196" fill="url(#amberCard)" stroke="#d97706"/><text class="cardTitle" x="1310" y="860">Outputs &amp; guardrails</text><text class="body" x="1310" y="887">speakers through Web Audio</text><text class="body" x="1310" y="909">authenticated local download</text><text class="body" x="1310" y="931">disk cache: 2 GB / 100 tracks</text><text class="body" x="1310" y="953">server: 127.0.0.1 only</text><text class="code" x="1310" y="992">health · ready · X-Local-Token</text>
  <path class="flowCyan" d="M1060 631 C1060 720 254 740 254 830"/><path class="flowRose" d="M1100 631 C1200 720 656 740 656 830"/><path class="flow" d="M656 1026 H882"/><path class="flow" d="M1242 928 H1286"/><text class="label" x="696" y="1047">mixed signal</text><text class="label" x="1250" y="913">tools / state</text><rect x="74" y="1060" width="1648" height="54" rx="14" fill="#0b1420" stroke="#334155"/><circle cx="102" cy="1087" r="7" fill="#22d3ee"/><text class="body" x="122" y="1092">Key principle:</text><text class="small" x="220" y="1092">stale results are cancelled, resources are released, and fallback stays explicit rather than silent.</text><text class="code" x="1394" y="1092">v1 · August 2026</text>
</svg>
