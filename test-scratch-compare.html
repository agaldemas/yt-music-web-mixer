<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Compare RMS: avec vs sans scratch</title>
<style>body{font:13px monospace;background:#111;color:#eee;padding:12px}pre{background:#000;padding:10px;border:1px solid #444;max-height:80vh;overflow:auto}button{padding:10px;background:#222;color:#eee;border:1px solid #555;cursor:pointer;margin:10px 0}#status{font-weight:bold}</style>
</head>
<body>
<h1>Test snap-back : compare RMS avant/après scratch</h1>
<button id="startBtn">▶ START</button>
<p id="status">en attente...</p>
<pre id="log"></pre>
<script>
const log = (...a) => {
  document.getElementById('log').textContent += a.join(' ') + '\n';
};
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function main() {
  const status = document.getElementById('status');
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();
  log('ctx state=', ctx.state);

  try {
    const audio = document.createElement('audio');
    audio.crossOrigin = 'anonymous';
    audio.preload = 'auto';
    audio.src = './Mandjou_QDIUL6T5GQU.mp3';
    document.body.appendChild(audio);
    await new Promise(r => audio.addEventListener('canplay', r, { once: true }));

    const masterGain = ctx.createGain();
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 2048;
    const sourceMuteGain = ctx.createGain();
    sourceMuteGain.gain.value = 1.0;
    const scratchGain = ctx.createGain();
    const resp = await fetch('./Mandjou_QDIUL6T5GQU.mp3');
    const scratchBuffer = await ctx.decodeAudioData(await resp.arrayBuffer());

    const source = ctx.createMediaElementSource(audio);
    source.connect(sourceMuteGain);
    sourceMuteGain.connect(scratchGain);
    scratchGain.connect(masterGain);
    masterGain.connect(analyser);
    masterGain.connect(ctx.destination);
    masterGain.gain.value = 1.0;

    const TEST_OFFSET = 10; // position de test (référence)
    const TEST_LEN = 1.5; // durée du test RMS

    function captureRms(seconds) {
      return new Promise(async (resolve) => {
        const samples = [];
        const start = Date.now();
        while (Date.now() - start < seconds * 1000) {
          const buf = new Uint8Array(analyser.fftSize);
          analyser.getByteTimeDomainData(buf);
          let sum = 0;
          for (let i = 0; i < buf.length; i++) {
            const v = (buf[i] - 128) / 128;
            sum += v * v;
          }
          samples.push(Math.sqrt(sum / buf.length));
          await sleep(20);
        }
        const mean = samples.reduce((a, b) => a + b, 0) / samples.length;
        const max = Math.max(...samples);
        // Captures les 20 premiers samples pour analyse spectrale grossière
        const first = samples.slice(0, 20).map(s => s.toFixed(4)).join(',');
        resolve({ mean, max, first });
      });
    }

    // ====== RÉFÉRENCE : audio.seek(10) puis play, sans scratch ======
    log('\n=== RÉFÉRENCE : play à 10s sans scratch ===');
    audio.currentTime = TEST_OFFSET;
    await new Promise(r => audio.addEventListener('seeked', r, { once: true }));
    await audio.play();
    log('[reference] play à 10s, capture...');
    const ref = await captureRms(TEST_LEN);
    log('[reference] mean=', ref.mean.toFixed(4), 'max=', ref.max.toFixed(4));
    log('[reference] first 20 RMS:', ref.first);
    audio.pause();

    // ====== AVEC SCRATCH : engage + disengage à 10s, puis play ======
    log('\n=== SCÉNARIO SCRATCH : engage/disengage à 10s ===');
    audio.currentTime = TEST_OFFSET;
    await new Promise(r => audio.addEventListener('seeked', r, { once: true }));
    audio.pause();

    // engage (même code que audio-engine.engageScratch)
    const scratchOffset = audio.currentTime; // 10s
    sourceMuteGain.disconnect();
    log('[engage] offset=', scratchOffset.toFixed(2));
    const scratchNode = ctx.createBufferSource();
    scratchNode.buffer = scratchBuffer;
    scratchNode.playbackRate.value = 0;
    scratchNode.connect(scratchGain);
    scratchNode.start(0, scratchOffset);
    scratchGain.gain.value = 1;
    await sleep(500); // laisse le MES accumuler un buffer interne

    // disengage (FIX V3 - le code actuel dans audio-engine.js)
    log('[disengage] début');
    sourceMuteGain.gain.value = 0;
    scratchGain.gain.value = 0;
    scratchNode.onended = null;
    scratchNode.stop();
    scratchNode.disconnect();
    audio.pause();
    audio.currentTime = scratchOffset; // 10s (même offset)
    await new Promise(r => audio.addEventListener('seeked', r, { once: true }));
    log('[disengage] seeked fired');
    sourceMuteGain.connect(scratchGain);
    sourceMuteGain.gain.value = 1;
    scratchGain.gain.value = 1;
    log('[disengage] reconnect OK');

    // play et capture
    log('[play] post-scratch');
    await audio.play();
    await sleep(200); // laisse le MES se stabiliser
    const post = await captureRms(TEST_LEN);
    log('[post-scratch] mean=', post.mean.toFixed(4), 'max=', post.max.toFixed(4));
    log('[post-scratch] first 20 RMS:', post.first);

    // ====== COMPARAISON ======
    const meanDelta = Math.abs(ref.mean - post.mean);
    const maxDelta = Math.abs(ref.max - post.max);
    log('\n=== COMPARAISON ===');
    log('RMS mean  ref=', ref.mean.toFixed(4), ' post=', post.mean.toFixed(4), ' delta=', meanDelta.toFixed(4));
    log('RMS max   ref=', ref.max.toFixed(4), ' post=', post.max.toFixed(4), ' delta=', maxDelta.toFixed(4));

    // Compare les premiers samples (là où le snap-back se manifeste le plus)
    const refFirst = ref.first.split(',').map(Number);
    const postFirst = post.first.split(',').map(Number);
    let diff = 0;
    for (let i = 0; i < Math.min(refFirst.length, postFirst.length); i++) {
      diff += Math.abs(refFirst[i] - postFirst[i]);
    }
    log('Somme |delta| des 20 premiers RMS:', diff.toFixed(4));
    if (diff > 0.5) {
      log('⚠️ DIFFÉRENCE SIGNIFICATIVE → SNAP-BACK probable');
    } else {
      log('✓ Signaux similaires → pas de snap-back');
    }

    status.textContent = 'TERMINE';
  } catch (err) {
    status.textContent = 'ERREUR: ' + err.message;
    log('ERREUR:', err.message, err.stack);
  }
}

document.getElementById('startBtn').onclick = () => {
  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('status').textContent = 'en cours...';
  main();
};
</script>
</body>
</html>
